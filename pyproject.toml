[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-notification-router"
version = "0.1.0"
description = "AI-powered WhatsApp Message Notification Router"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
whatsapp-router = "code.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
